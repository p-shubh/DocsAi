root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/api"
bin = "./tmp/main"

include_ext = ["go","tpl","tmpl","html","yaml","yml"]

exclude_dir = [
    "vendor",
    "tmp",
    ".git"
]

delay = 1000

kill_delay = "500ms"

send_interrupt = true

stop_on_error = true

log = "build-errors.log"

[color]
main = "blue"
watcher = "cyan"
build = "yellow"
runner = "green"

[log]
time = true