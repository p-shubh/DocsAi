services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: docsai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docsai
      POSTGRES_PASSWORD: docsai
      POSTGRES_DB: docsai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docsai

  redis:
    image: redis:8-alpine
    container_name: docsai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docsai

  minio:
    image: minio/minio:latest
    container_name: docsai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: docsai
      MINIO_ROOT_PASSWORD: docsai123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - docsai

